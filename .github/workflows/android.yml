name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear APK
        run: |
          mkdir -p saida
          cp android/app/build/outputs/apk/release/*.apk "saida/O-Ultimo-Espetaculo-v1.0.${{ github.run_number }}.apk"
          ls -la saida

      - uses: actions/upload-artifact@v4
        with:
          name: O-Ultimo-Espetaculo-apk
          path: saida/*.apk

      # Release com o APK anexado: baixa direto pelo celular (página Releases do repositório)
      - name: Publicar no Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: O Último Espetáculo — APK ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            APK gerado automaticamente a partir do branch `${{ github.ref_name }}` (commit ${{ github.sha }}).
            No celular: baixe o arquivo .apk abaixo, abra e permita "instalar apps desconhecidos" quando o Android pedir.
          files: saida/*.apk
